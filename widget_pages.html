<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local pages</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏎️</text></svg>">
<style>
:root { --bg:#f6f7f9; --fg:#1b1f24; --muted:#667085; --line:#e4e7ec; --link:#2563eb; --bad:#dc2626 }
@media (prefers-color-scheme: dark) { :root { --bg:#111318; --fg:#e6e8ec; --muted:#8b93a1; --line:#242833; --link:#60a5fa; --bad:#f87171 } }
* { box-sizing:border-box } html, body { margin:0; background:var(--bg); overflow:hidden }
body { padding:7px 10px 6px; color:var(--fg); font:12px/1.3 system-ui,-apple-system,sans-serif }
.h { display:flex; justify-content:space-between; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:3px }
.r { display:flex; align-items:center; gap:6px; padding:4px 0; border-top:1px solid var(--line) }
.r a { flex:1; min-width:0; color:var(--fg); text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.r a:hover { color:var(--link) }
.m { color:var(--muted); font-size:11px; white-space:nowrap; font-variant-numeric:tabular-nums }
.x { border:0; background:none; color:var(--muted); font-size:15px; line-height:1; padding:0 2px; cursor:pointer }
.x:hover { color:var(--bad) }
.e { color:var(--muted); padding:4px 0; border-top:1px solid var(--line) }
</style></head><body>
<div class="h"><span>🏎️ Local pages</span><span id="stamp"></span></div>
<div id="list"><div class="e">loading…</div></div>
<script src="dock.js"></script>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago = t => { const s = Date.now() / 1000 - t; return s < 3600 ? `${Math.round(s / 60)}m` : s < 172800 ? `${Math.round(s / 3600)}h` : `${Math.round(s / 86400)}d`; };
const date = t => new Date(t * 1000).toLocaleString([], {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
let pages = [];
let height = 0;
function fit() {  // the window takes the height of its content, below the widget before it (dock.js)
  height = document.body.scrollHeight + (outerHeight - innerHeight);
  if (Math.abs(outerHeight - height) > 1) resizeTo(outerWidth, height);
  dock('pages', height);
}
async function refresh() {
  try { pages = await (await fetch('pages.json', {cache:'no-store'})).json(); } catch (e) { return; }
  document.getElementById('list').innerHTML = pages.length ? pages.map((p, i) => `<div class="r">
    <a href="http://127.0.0.1:${p.port}/" target="_blank" title="${esc(p.desc)}\nstarted ${p.started ? date(p.started) : '?'}\n${esc(p.cmd)}">${esc(p.desc)}</a>
    <span class="m">:${p.port} · ${p.started ? ago(p.started) : '?'}</span>
    <button class="x" title="Stop" onclick="stop(${i})">×</button></div>`).join('') : '<div class="e">none running</div>';
  document.getElementById('stamp').textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  fit();
}
async function stop(i) {
  const p = pages[i];
  if (!confirm(`Stop "${p.desc}" on port ${p.port}?\n\nThis ends its process (pid ${p.pid}); anything unsaved in that page is lost.`)) return;
  const r = await fetch('stop', {method:'POST', body:JSON.stringify({pid:p.pid, port:p.port})});
  if (!r.ok) alert((await r.json()).error || 'could not stop it');
  setTimeout(refresh, 800);
}
refresh(); setInterval(refresh, __REFRESH__ * 1000);
if (__REFRESH__ <= 60) setInterval(() => dock('pages', height), 5000);  // follow the one above closely on the mini
addEventListener('focus', refresh);
</script></body></html>
