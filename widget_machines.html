<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Machines</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛻</text></svg>">
<style>
:root { --bg:#f6f7f9; --fg:#1b1f24; --muted:#667085; --line:#e4e7ec; --track:#e7e9ee; --link:#2563eb;
  --cpu:#2563eb; --gpu:#16a34a; --ram:#9333ea; --warn:#d97706; --bad:#dc2626; --ok:#16a34a }
@media (prefers-color-scheme: dark) { :root { --bg:#111318; --fg:#e6e8ec; --muted:#8b93a1; --line:#242833; --track:#262b36;
  --link:#60a5fa; --cpu:#60a5fa; --gpu:#4ade80; --ram:#c084fc; --warn:#fbbf24; --bad:#f87171; --ok:#4ade80 } }
* { box-sizing:border-box } html, body { margin:0; background:var(--bg); overflow:hidden }
body { padding:7px 10px 6px; color:var(--fg); font:12px/1.3 system-ui,-apple-system,sans-serif }
.h { display:flex; justify-content:space-between; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:3px }
.h a { color:var(--muted); text-decoration:none } .h a:hover { color:var(--link) }
.h b { display:inline-block; width:8px; height:3px; vertical-align:middle; margin:0 3px 0 7px; border-radius:2px }
.r { display:grid; grid-template-columns:78px 1fr 1fr 1fr; gap:8px; align-items:center; padding:4px 0; border-top:1px solid var(--line) }
.r.off { opacity:.5 } .n { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.vm .n { color:var(--muted) }
.dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--ok); margin-right:5px; vertical-align:1px }
.off .dot { background:var(--bad) } .warn .dot { background:var(--warn) }
.c { display:flex; align-items:center; gap:4px; font-size:10.5px; color:var(--muted); font-variant-numeric:tabular-nums }
.c span { width:20px; text-align:right } .c i { flex:1; height:4px; border-radius:2px; background:var(--track); overflow:hidden }
.c i u { display:block; height:100% }
</style></head><body>
<div class="h"><a href="__DASH__/" target="_blank">🛻 Machines ↗</a>
  <span><b style="background:var(--cpu)"></b>cpu<b style="background:var(--ram)"></b>ram<b style="background:var(--gpu)"></b>gpu <span id="stamp"></span></span></div>
<div id="list"><div class="r">loading…</div></div>
<script>
let META = {};  // name -> host (set for a virtual machine), from the dashboard's /config.json
const GB = 1e9, esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cell = (v, c) => v == null ? '<div class="c"></div>'
  : `<div class="c"><span>${Math.round(v)}</span><i><u style="width:${Math.min(100, v)}%;background:var(${c})"></u></i></div>`;
const low = k => k.free < (['/', 'C:\\'].includes(k.mount) ? 100 : 50) * GB;  // as alerts.py: system disk < 100 GB, any disk < 50 GB
const gb = b => b >= 1e12 ? (b / 1e12).toFixed(1) + ' TB' : Math.round(b / GB) + ' GB';
function row(d) {
  if (!d.mem_total) return `<div class="r off"><span class="n"><span class="dot"></span>${d.name}</span></div>`;
  const g = (d.gpus || [])[0], jobs = g ? g.procs.filter(p => p.mem || !d.os.startsWith('Windows')).length : 0;  // Windows lists every app that draws
  const lowDisks = d.disks.filter(low);
  const tip = [d.os, d.users?.length ? 'logged in: ' + d.users.join(', ') : '', jobs ? `${jobs} GPU job${jobs > 1 ? 's' : ''}` : '',
    ...d.disks.map(k => `${k.mount}: ${gb(k.free)} free`), d.ok ? '' : 'offline: ' + d.error].filter(Boolean).join('\n');
  return `<div class="r ${d.ok ? '' : 'off'} ${lowDisks.length ? 'warn' : ''} ${META[d.name]?.host ? 'vm' : ''}" title="${esc(tip)}">
    <span class="n"><span class="dot"></span>${META[d.name]?.host ? '↳ ' + d.name : d.name}</span>
    ${cell(d.cpu, '--cpu')}${cell(100 - 100 * d.mem_avail / d.mem_total, '--ram')}${cell(g ? g.util : null, '--gpu')}</div>`;
}
let height = 0;
function fit() {
  height = document.body.scrollHeight + (outerHeight - innerHeight);
  if (Math.abs(outerHeight - height) > 1) resizeTo(outerWidth, height);
}
async function dock() {  // just below the pages widget, wherever it is and however tall; then tells the globe below
  try {
    const p = await (await fetch('layout?name=pages', {cache:'no-store'})).json();
    const x = p.h ? p.x : screenX, y = p.h ? p.y + p.h : screenY;
    if (screenX !== x || screenY !== y) moveTo(x, y);
    await fetch('layout?name=machines', {method:'POST', body:JSON.stringify({x, y, h:Math.max(height, outerHeight)})});
  } catch (e) {}
}
async function refresh() {
  try {
    if (!Object.keys(META).length)
      META = Object.fromEntries((await (await fetch('config.json')).json()).machines.map(m => [m.name, m]));
    const list = await (await fetch('status.json', {cache:'no-store'})).json();
    if (list.error) throw new Error(list.error);
    document.getElementById('list').innerHTML = list.map(row).join('');
    document.getElementById('stamp').textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  } catch (e) { document.getElementById('stamp').textContent = 'dashboard unreachable'; }
  fit(); dock();
}
refresh(); setInterval(refresh, __REFRESH__ * 1000);
if (__REFRESH__ <= 60) setInterval(dock, 5000);  // follow the pages widget closely on the mini; on the laptop with each refresh
addEventListener('focus', refresh);
</script></body></html>
